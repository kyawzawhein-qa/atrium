<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Atrium mark">
  <defs>
    <linearGradient id="skylight" x1="256" y1="48" x2="256" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7eb6b0" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#7eb6b0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7eb6b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorGlow" x1="256" y1="300" x2="256" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7eb6b0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7eb6b0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sq"><rect width="512" height="512" rx="96"/></clipPath>
  </defs>
  <!-- Transparent outside; soft panel plate optional — keep transparent for mark -->
  <!-- Outer architectural frame -->
  <g fill="none" stroke="#e8eef2" stroke-width="18" stroke-linejoin="round">
    <rect x="56" y="56" width="400" height="400" rx="28"/>
  </g>
  <!-- Inner court / atrium walls in perspective -->
  <path d="M120 420 L180 200 L332 200 L392 420 Z" fill="#152028" fill-opacity="0.55" stroke="#e8eef2" stroke-width="10" stroke-linejoin="round"/>
  <!-- Skylight aperture (diamond / rect opening) -->
  <path d="M196 200 L256 128 L316 200 L256 188 Z" fill="#0c1216" stroke="#7eb6b0" stroke-width="8" stroke-linejoin="round"/>
  <!-- Light shaft from skylight -->
  <path d="M210 200 L256 140 L302 200 L280 360 L232 360 Z" fill="url(#skylight)"/>
  <!-- Floor pool of light -->
  <ellipse cx="256" cy="400" rx="92" ry="28" fill="url(#floorGlow)"/>
  <!-- Center mullion / cross of skylight (architectural) -->
  <path d="M256 140 V200" stroke="#7eb6b0" stroke-width="6" stroke-linecap="round"/>
  <path d="M220 176 H292" stroke="#7eb6b0" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <!-- Subtle corner ticks -->
  <g stroke="#7eb6b0" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <path d="M88 120 V88 H120"/>
    <path d="M424 120 V88 H392"/>
    <path d="M88 392 V424 H120"/>
    <path d="M424 392 V424 H392"/>
  </g>
</svg>
